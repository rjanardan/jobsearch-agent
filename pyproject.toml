[project]
name = "jobsearch-agent"
version = "0.1.0"
description = "Open-source agentic job-search copilot: nightly discovery, profile matching, application artifacts, tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-postgres>=2.0",
    "litellm>=1.60",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "feedparser>=6.0",
    "typer>=0.15",
    "arize-phoenix>=20.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
