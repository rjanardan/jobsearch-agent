# Optional — for VM deployment on other hardware. The v0.1 dev host uses
# brew/uv-native services instead (no Docker dependency on the dev machine).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: jobagent
      POSTGRES_PASSWORD: jobagent
      POSTGRES_DB: jobagent
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006": "6006"]
    volumes: [phoenix_data:/var/lib/phoenix]

  ollama:
    image: ollama/ollama:latest
    ports: ["11434:11434"]
    volumes: [ollama_data:/root/.ollama]

volumes:
  pgdata:
  phoenix_data:
  ollama_data:
